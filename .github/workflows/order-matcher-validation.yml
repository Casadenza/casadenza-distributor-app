name: Order and shipment matching validation
on:
  pull_request:
    paths:
      - 'lib/operations-matcher.ts'
      - 'lib/shipment-mail.ts'
      - 'lib/shipment-pdf-text.ts'
      - 'app/(admin)/admin/operations/**'
      - 'app/api/admin/operations/**'
      - 'tests/operations-matcher.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/order-matcher-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b163d088150bdf7ac38e37f6c95 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run test:order-matcher
      - run: npx tsc --noEmit
      - run: npm run lint -- --no-cache
