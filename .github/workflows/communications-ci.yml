name: Distributor communications validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/responsive-communications-centre]

permissions:
  contents: read

jobs:
  validate:
    name: Prisma + TypeScript + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Type-check the application
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --no-cache
